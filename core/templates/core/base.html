<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}DevPortal{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body, button, input, select, textarea, a {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f6f8fa;
      margin: 0;
      padding: 0;
      color: #24292f;
    }

    .page-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    /* Навигация */
    .top-nav {
      background-color: #f0f4f8;
      padding: 10px 20px;
      border-bottom: 1px solid #d0d7de;
    }

    .top-nav .nav-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .top-nav .nav-layout {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Кнопки */
    .nav-button,
    .form-button {
      display: inline-block;
      background-color: #ddf4ff;
      border: 1px solid #0969da;
      border-radius: 6px;
      padding: 6px 14px;
      text-decoration: none;
      color: #0969da;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .nav-button:hover,
    .form-button:hover {
      background-color: #c2e6ff;
    }

    .nav-button.danger {
      background-color: #ffebe9;
      border-color: #cf222e;
      color: #cf222e;
    }

    .nav-button.danger:hover {
      background-color: #ffdce0;
    }

    /* Формы */
    .form-card {
      background-color: white;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      padding: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      box-sizing: border-box;
    }

    .form-error {
      background-color: #ffe3e6;
      border: 1px solid #db143c;
      color: #8b0000;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    /* Сообщения */
    .message {
      padding: 12px 20px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-weight: bold;
      transition: opacity 1s ease;
    }

    .message-info {
      background-color: #e6f0ff;
      border: 1px solid #b3d1ff;
      color: #004085;
    }

    .message-error {
      background-color: #ffe6e6;
      border: 1px solid #ff9999;
      color: #991f1f;
    }

    .fade-out {
      animation: fadeOut 1s ease forwards;
      animation-delay: 5s;
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
        transform: translateY(-5px);
      }
    }

    /* Таблицы */
    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #d0d7de;
      text-align: left;
    }

    th {
      background-color: #f6f8fa;
    }

    code {
      background-color: #f1f1f1;
      padding: 2px 4px;
      border-radius: 4px;
      font-family: monospace;
    }

    /* Статусы */
    .status-overdue { background-color: #ffdce0; }
    .status-10      { background-color: #fff5b1; }
    .status-30      { background-color: #ffe29a; }
    .status-50      { background-color: #d2f4c4; }
    .status-healthy { background-color: #b1f0d3; }

    /* Dropzone */
    .dropzone-wrapper {
      border: 2px dashed #d0d7de;
      border-radius: 8px;
      padding: 30px;
      background-color: #f6f8fa;
      cursor: pointer;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .dropzone-wrapper:hover {
      border-color: #0969da;
      background-color: #e6f0fb;
    }

    .fake-button {
      color: #0969da;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 🔗 Навигация -->
  <div class="top-nav">
    <div class="nav-layout">
      <div class="nav-group">
        <a href="/" class="nav-button">🏠 Главная</a>
        <a href="/projects/" class="nav-button">📁 Проекты</a>
        <a href="/assignments/" class="nav-button">🎞️ Назначения</a>
        <a href="/files/" class="nav-button">📄 Файлы</a>
        <a href="/tests/" class="nav-button">🧪 Тесты</a>
      </div>
      <div class="nav-group">
        <a href="/logout/" class="nav-button danger">📤 Выход</a>
      </div>
    </div>
  </div>

  <!-- 📦 Контент -->
  <div class="page-container">
    {% block content %}{% endblock %}
  </div>

  <script>
    // JS для исчезновения alert
    document.addEventListener("DOMContentLoaded", () => {
      const fadeMessages = document.querySelectorAll(".fade-out");
      fadeMessages.forEach(msg => {
        setTimeout(() => {
          msg.style.opacity = "0";
          setTimeout(() => msg.remove(), 1000);
        }, 10000);
      });
    });
  </script>
</body>
</html>
